name: Deploy static content to GitHub Pages

# Deploy the static site on every published release, or manually
# from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions required to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; queue instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # On release events this checks out the released commit; on manual
        # runs it checks out the branch selected in the Actions UI.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # No build step: the site is already built (lib/ is committed and
      # referenced directly by the .html files), so upload the repo root
      # as the static site.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
